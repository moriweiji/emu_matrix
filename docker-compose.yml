services:
  emu-matrix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emu-matrix
    ports:
      - "80:80"
      - "3000:3000"
      - "3005:3005"
      - "5432:5432"
      - "6379:6379"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - redis_data:/data/redis
      - storage_data:/data/storage
    environment:
      JWT_ACCESS_SECRET: production-access-secret-change-me
      JWT_REFRESH_SECRET: production-refresh-secret-change-me
    shm_size: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
  redis_data:
  storage_data:
